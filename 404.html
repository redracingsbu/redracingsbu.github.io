<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var l = window.location;
        var path = l.pathname.replace(/^\/+/, '');
        var search = l.search.replace(/^\?/, '').replace(/&/g, '~and~');
        var hash = l.hash || '';
        var newUrl =
          '/' +
          (path ? '?' + '/' + path + (search ? '?' + search : '') : '') +
          hash;
        l.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
